# Pinned from the working `aloha` env used for all DemoSpeedup / kin_seg runs.
# CUDA 11.8 wheels; adjust the torch index URL if the lab server uses another CUDA.
name: tsresample
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.7.1+cu118
      - torchvision==0.22.1+cu118
      - numpy==1.23.3
      - scipy==1.9.1
      - h5py==3.8.0
      - mujoco==2.3.3
      - dm-control==1.0.9
      - pyquaternion==0.9.9
      - PyYAML==6.0
      - opencv-python==4.7.0.72
      - matplotlib==3.7.1
      - einops==0.6.0
      - packaging==23.0
      - pexpect==4.8.0
      - ipython==8.12.0
      - tqdm==4.64.1
      - scikit-learn==1.6.1
      - hdbscan==0.8.42
      - wandb==0.13.3
      - tensorboard==2.10.1
      - termcolor==2.0.1
      # Diffusion Policy (E5)
      - diffusers==0.11.1
      - huggingface-hub==0.16.4
      - transformers==4.30.2
      - zarr==2.12.0
      - numcodecs==0.10.2
      - hydra-core==1.2.0
      - dill==0.3.5.1
      - robomimic==0.2.0
      - gym==0.26.2
      - imageio==2.22.0
      - av==10.0.0
      - scikit-image==0.19.3
      - scikit-video==1.1.11
      - numba==0.53.1
      - pymunk==6.2.1
      - Shapely==1.8.4
