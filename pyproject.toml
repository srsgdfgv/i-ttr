[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsresample"
version = "0.1.0"
description = "Interaction-driven adaptive temporal resampling for imitation demos"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "h5py",
  "torch",
]

[tool.setuptools.packages.find]
include = ["tsr*", "adapters*", "sim_tools*"]
